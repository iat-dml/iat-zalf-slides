title: zalf-iat
author: IAT Data and Modelling Infrastructure for Living Labs (DML)
version: 0.1.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    revealjs:
      theme: default
      css: zalf-iat.css
      template-partials:
        - title-slide.html
      width: 1280
      height: 720
      margin: 0
      center: false
      controls: false
      progress: true
      slide-number: c/t
      hash: true
      menu: false
      transition: none
      # Deck switches. Override in the document front matter.
      deck-brand: iat          # iat | zalf
      deck-audience: internal  # internal | external (external shows funder logos on the title slide)
      ai-note: true            # "created with the assistance of Claude" on the title slide
